name: Build & Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Git LFS pull
        run: |
          git lfs install --skip-smudge=0
          git lfs pull
          git lfs ls-files

      - name: Git LFS sanity
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs fetch --all || true
          git lfs checkout || true
          echo "[tree] apps/website/public/uploads (top 20)"
          (test -d apps/website/public/uploads && ls -lah apps/website/public/uploads | head -n 20) || echo "no uploads dir"

      # fail fast: никакие LFS-пойнтеры не должны остаться в публичных ассетах
      - name: Assert no LFS pointers in public assets
        run: |
          set -e
          for d in apps/website/public/uploads apps/website/public/logos; do
            if [ -d "$d" ]; then
              ! grep -R "git-lfs.github.com/spec/v1" -n "$d" || (echo "LFS pointers found in $d"; exit 1)
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name (lowercase)
        shell: bash
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Load defaults from .env.build (optional)
        shell: bash
        run: |
          if [ -f .env.build ]; then
            set -a; . ./.env.build; set +a
            echo "PUBLIC_CAL_USERNAME=${PUBLIC_CAL_USERNAME}" >> $GITHUB_ENV || true
            echo "PUBLIC_CAL_EMBED_LINK=${PUBLIC_CAL_EMBED_LINK}" >> $GITHUB_ENV || true
            echo "PUBLIC_CAL_EVENTS=${PUBLIC_CAL_EVENTS}" >> $GITHUB_ENV || true
            echo "PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" >> $GITHUB_ENV || true
            echo "PUBLIC_ENV=${PUBLIC_ENV}" >> $GITHUB_ENV || true
            echo "PUBLIC_DECAP_CMS_VERSION=${PUBLIC_DECAP_CMS_VERSION}" >> $GITHUB_ENV || true
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PUBLIC_CAL_USERNAME=${{ vars.PUBLIC_CAL_USERNAME || env.PUBLIC_CAL_USERNAME || 'dmitrybond' }}
            PUBLIC_CAL_EMBED_LINK=${{ vars.PUBLIC_CAL_EMBED_LINK || env.PUBLIC_CAL_EMBED_LINK || 'https://cal.com/dmitrybond' }}
            PUBLIC_CAL_EVENTS=${{ vars.PUBLIC_CAL_EVENTS || env.PUBLIC_CAL_EVENTS || 'intro-30m|Intro 30m,tech-90m|Tech 90m,mentoring-60m|Mentoring 60m' }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || env.PUBLIC_SITE_URL || 'https://dmitrybond.tech' }}
            PUBLIC_ENV=${{ vars.PUBLIC_ENV || env.PUBLIC_ENV || 'production' }}
            PUBLIC_DECAP_CMS_VERSION=${{ vars.PUBLIC_DECAP_CMS_VERSION || env.PUBLIC_DECAP_CMS_VERSION || '3.8.3' }}
            DECAP_GITHUB_CLIENT_ID=${{ secrets.DECAP_GITHUB_CLIENT_ID || '' }}
            DECAP_GITHUB_CLIENT_SECRET=${{ secrets.DECAP_GITHUB_CLIENT_SECRET || '' }}
            AUTHJS_GITHUB_CLIENT_ID=${{ secrets.AUTHJS_GITHUB_CLIENT_ID || '' }}
            AUTHJS_GITHUB_CLIENT_SECRET=${{ secrets.AUTHJS_GITHUB_CLIENT_SECRET || '' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build success
        run: |
          echo "✅ Build completed successfully"
          echo "Image tags created:"
          docker images | grep "${{ env.IMAGE_NAME }}" || echo "No images found"
          echo "Build artifacts:"
          ls -la apps/website/dist/ 2>/dev/null || echo "No dist directory found"

      - name: Install Node.js for verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/website/package-lock.json'

      - name: Install dependencies for verification
        run: |
          cd apps/website
          npm install

      - name: Build website for verification
        run: |
          cd apps/website
          echo "Building website for asset verification..."
          npm run build

      - name: Check build output
        run: |
          cd apps/website
          echo "Checking build output..."
          if [ -d "dist" ]; then
            echo "Dist directory contents:"
            ls -la dist/
            if [ -d "dist/client" ]; then
              echo "Client directory contents:"
              ls -la dist/client/
            else
              echo "No client directory found in dist/"
            fi
          else
            echo "No dist directory found at all"
          fi

      - name: Verify static assets
        run: |
          cd apps/website
          if [ -d "dist/client" ]; then
            echo "Running static asset verification..."
            node tools/verify-static.mjs --verbose
          else
            echo "❌ No dist/client directory found"
            echo "This indicates the build step failed or did not complete"
            echo "Please check the build logs above for errors"
            exit 1
          fi
        continue-on-error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: apps/website/dist/
          retention-days: 7