name: Build and Push SSR to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: site-ssr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dmitrybond-tech/personal-website-prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS pull
        run: |
          git lfs install
          git lfs pull
          git lfs ls-files

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load env defaults from .env.build
        shell: bash
        run: |
          if [ -f .env.build ]; then
            echo "Found .env.build, loading defaults..."
            set -a; . ./.env.build; set +a
            echo "PUBLIC_CAL_USERNAME=${PUBLIC_CAL_USERNAME}" >> $GITHUB_ENV || true
            echo "PUBLIC_CAL_EMBED_LINK=${PUBLIC_CAL_EMBED_LINK}" >> $GITHUB_ENV || true
            echo "PUBLIC_CAL_EVENTS=${PUBLIC_CAL_EVENTS}" >> $GITHUB_ENV || true
            echo "PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" >> $GITHUB_ENV || true
            echo "PUBLIC_ENV=${PUBLIC_ENV}" >> $GITHUB_ENV || true
            echo "PUBLIC_DECAP_CMS_VERSION=${PUBLIC_DECAP_CMS_VERSION}" >> $GITHUB_ENV || true
            echo "Loaded keys: $(grep -o '^[A-Z_]*=' .env.build | cut -d= -f1 | tr '\n' ' ')"
          else
            echo "No .env.build found, using defaults"
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./apps/website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            PUBLIC_CAL_USERNAME=${{ vars.PUBLIC_CAL_USERNAME || env.PUBLIC_CAL_USERNAME || 'dmitrybond' }}
            PUBLIC_CAL_EMBED_LINK=${{ vars.PUBLIC_CAL_EMBED_LINK || env.PUBLIC_CAL_EMBED_LINK || 'https://cal.com/dmitrybond' }}
            PUBLIC_CAL_EVENTS=${{ vars.PUBLIC_CAL_EVENTS || env.PUBLIC_CAL_EVENTS || 'intro-30m|Intro 30m,tech-90m|Tech 90m,mentoring-60m|Mentoring 60m' }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || env.PUBLIC_SITE_URL || 'https://dmitrybond.tech' }}
            PUBLIC_ENV=${{ vars.PUBLIC_ENV || env.PUBLIC_ENV || 'production' }}
            PUBLIC_DECAP_CMS_VERSION=${{ vars.PUBLIC_DECAP_CMS_VERSION || env.PUBLIC_DECAP_CMS_VERSION || '3.8.3' }}
