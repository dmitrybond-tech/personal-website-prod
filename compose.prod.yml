version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        # Build-time variables (PUBLIC_*) - injected during build
        PUBLIC_CAL_USERNAME: ${PUBLIC_CAL_USERNAME}
        PUBLIC_CAL_EMBED_LINK: ${PUBLIC_CAL_EMBED_LINK}
        PUBLIC_CAL_EVENTS: ${PUBLIC_CAL_EVENTS}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        PUBLIC_ENV: ${PUBLIC_ENV}
        PUBLIC_DECAP_CMS_VERSION: ${PUBLIC_DECAP_CMS_VERSION}
        # Git information
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - env.prod
    environment:
      # Runtime variables (server-side only)
      - NODE_ENV=production
      - SOCKET_PATH=/socket/astro.sock
    # Volume для раздачи статики через Caddy на хосте
    volumes:
      - website-static:/app/dist/client:ro
      - /var/run/website:/socket
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`yourdomain.com`)"
      - "traefik.http.services.website.loadbalancer.server.port=3000"

# Named volume для статики
volumes:
  website-static:
    driver: local
