server {
    listen 80;
    server_name _;

    # Static files built by Astro are copied to this directory
    root /usr/share/nginx/html;
    index index.html;

    # Basic gzip compression for common text assets
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Main application: SPA-style routing
    #
    # - Serve files directly when they exist
    # - Fallback to /index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: long cache for built assets (Astro's _astro/)
    location /_astro/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # As a safety net, convert 404s to SPA entrypoint
    error_page 404 /index.html;
}


